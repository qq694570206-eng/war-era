<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>钢铁防线 Demo v0.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
#gameCanvas{display:block;position:absolute;top:0;left:0}
#uiOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* 资源条 */
#resourceBar{position:absolute;top:6px;left:6px;background:rgba(13,17,23,0.9);border:1px solid #30363d;border-radius:8px;padding:6px 12px;color:#c9d1d9;font-size:12px;display:flex;gap:14px;pointer-events:auto;backdrop-filter:blur(4px)}
#resourceBar .res{display:flex;align-items:center;gap:3px}
#resourceBar .icon{font-size:14px}
#resourceBar .val{color:#F2C14E;font-weight:bold;min-width:40px;font-variant-numeric:tabular-nums}
#resourceBar .val.low{color:#C0392B}
#resourceBar .val.pow-ok{color:#3FA7D6}
#resourceBar .val.pow-low{color:#E74C3C}

/* 小地图 */
#miniMap{position:absolute;top:6px;right:6px;width:160px;height:120px;background:rgba(13,17,23,0.9);border:1px solid #30363d;border-radius:6px;pointer-events:auto;cursor:pointer;backdrop-filter:blur(4px)}

/* 警报 */
#alertBar{position:absolute;top:132px;right:6px;width:160px;background:rgba(139,30,30,0.9);border:1px solid #8B1E1E;border-radius:6px;padding:5px 8px;color:#fff;font-size:11px;text-align:center;display:none;animation:pulse-alert 0.8s infinite alternate}
@keyframes pulse-alert{from{box-shadow:0 0 4px rgba(139,30,30,0.5)}to{box-shadow:0 0 12px rgba(231,76,60,0.7)}}

/* 编队栏 */
#squadBar{position:absolute;right:6px;top:170px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
.squad-btn{width:36px;height:36px;border:1px solid #30363d;border-radius:6px;background:rgba(13,17,23,0.9);color:#8b949e;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all 0.12s}
.squad-btn:active{transform:scale(0.92)}
.squad-btn.has-units{border-color:#3FA7D6;color:#3FA7D6;background:rgba(63,167,214,0.15)}
.squad-btn .count{position:absolute;bottom:-2px;right:-2px;font-size:8px;background:#F2C14E;color:#000;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.squad-btn.empty{opacity:0.4}

/* 建造面板 */
#buildPanel{position:absolute;bottom:0;left:0;right:0;background:rgba(13,17,23,0.92);border-top:1px solid #30363d;padding:6px 8px;pointer-events:auto;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;backdrop-filter:blur(6px);min-height:72px}
.build-cat{font-size:10px;color:#6e7681;width:40px;text-align:center;border-right:1px solid #30363d;padding-right:4px;flex-shrink:0}
.build-btn{width:56px;height:56px;border:1.5px solid #30363d;border-radius:8px;background:#161b22;color:#c9d1d9;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.12s;gap:1px;position:relative;flex-shrink:0}
.build-btn:active{transform:scale(0.93)}
.build-btn .bicon{font-size:20px}
.build-btn .bname{font-size:8px;text-align:center;line-height:1.1}
.build-btn .bcost{font-size:8px;color:#F2C14E}
.build-btn.disabled{opacity:0.35;filter:grayscale(0.5)}
.build-btn.disabled .bcost{color:#C0392B}
.build-btn.selected{border-color:#F2C14E;background:rgba(242,193,78,0.12);box-shadow:0 0 10px rgba(242,193,78,0.3)}
.build-btn .lock{position:absolute;top:2px;right:2px;font-size:8px;color:#C0392B}

/* 单位信息卡 */
#unitInfo{position:absolute;bottom:80px;right:6px;width:180px;background:rgba(13,17,23,0.92);border:1px solid #30363d;border-radius:8px;padding:8px;color:#c9d1d9;font-size:11px;pointer-events:auto;display:none;backdrop-filter:blur(4px)}
#unitInfo .title{font-size:12px;font-weight:bold;margin-bottom:4px;color:#F2C14E;display:flex;justify-content:space-between;align-items:center}
#unitInfo .count-badge{background:#3FA7D6;color:#000;padding:1px 6px;border-radius:8px;font-size:10px}
#unitInfo .hp-bar{width:100%;height:5px;background:#21262d;border-radius:3px;margin:3px 0;overflow:hidden}
#unitInfo .hp-fill{height:100%;border-radius:3px;transition:width 0.2s}
#unitInfo .stat{display:flex;justify-content:space-between;margin:1px 0;color:#8b949e}
#unitInfo .stat span:last-child{color:#c9d1d9}
#unitInfo .armor-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:bold}
.armor-light{background:#3d2817;color:#e8a44d}
.armor-vehicle{background:#1a2d1a;color#6bcf6b}
.armor-heavy{background:#2d1a1a;color:#cf6b6b}
.armor-building{background:#1a1a2d;color:#6b8ccf}
#unitInfo .cmd-row{display:flex;gap:4px;margin-top:4px}
.cmd-btn{flex:1;padding:5px;border:1px solid #30363d;border-radius:4px;background:#161b22;color:#8b949e;font-size:10px;cursor:pointer;text-align:center}
.cmd-btn:active{background:#30363d;color:#c9d1d9}
.cmd-btn.active{border-color:#F2C14E;color:#F2C14E}

/* 提示 */
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.5);font-size:13px;text-align:center;pointer-events:none;z-index:5;max-width:300px;line-height:1.6}
#toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#F2C14E;padding:6px 14px;border-radius:6px;font-size:11px;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:20;white-space:nowrap}

/* 主菜单 */
#mainMenu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:auto;gap:16px}
#mainMenu h1{color:#F2C14E;font-size:28px;margin-bottom:4px;letter-spacing:2px}
#mainMenu .subtitle{color:#8b949e;font-size:13px;margin-bottom:12px}
.menu-section{background:rgba(22,27,34,0.9);border:1px solid #30363d;border-radius:10px;padding:16px 24px;min-width:280px}
.menu-section .label{color:#6e7681;font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.menu-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.menu-opt{padding:8px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#8b949e;font-size:12px;cursor:pointer;transition:all 0.12s}
.menu-opt:active{transform:scale(0.95)}
.menu-opt.selected{border-color:#F2C14E;background:rgba(242,193,78,0.12);color:#F2C14E}
#startBtn{margin-top:8px;padding:12px 36px;border:2px solid #F2C14E;border-radius:8px;background:rgba(242,193,78,0.15);color:#F2C14E;font-size:15px;font-weight:bold;cursor:pointer;transition:all 0.15s}
#startBtn:active{transform:scale(0.95);background:rgba(242,193,78,0.25)}

/* 科技/超武按钮 */
#techBtn{position:absolute;top:44px;left:6px;padding:4px 10px;border:1px solid #30363d;border-radius:6px;background:rgba(13,17,23,0.9);color:#8b949e;font-size:11px;cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px)}
#techBtn:active{background:#30363d}
#techBtn.ready{border-color:#9B59B6;color:#9B59B6;box-shadow:0 0 8px rgba(155,89,182,0.4)}

/* 超武就绪面板 */
#superWeaponBtn{position:absolute;bottom:80px;left:6px;padding:6px 12px;border:2px solid #C0392B;border-radius:8px;background:rgba(139,30,30,0.2);color:#E74C3C;font-size:11px;cursor:pointer;pointer-events:auto;display:none;animation:pulse-sw 1s infinite alternate}
@keyframes pulse-sw{from{box-shadow:0 0 4px rgba(231,76,60,0.3)}to{box-shadow:0 0 16px rgba(231,76,60,0.6)}}
#superWeaponBtn.ready{display:block}

/* 科技面板 */
#techPanel{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(13,17,23,0.95);border:1px solid #30363d;border-radius:10px;padding:12px;display:none;pointer-events:auto;z-index:15;min-width:300px}
#techPanel .tp-title{color:#F2C14E;font-size:13px;font-weight:bold;margin-bottom:8px;text-align:center}
.tech-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid #30363d;border-radius:6px;margin-bottom:4px;background:#161b22}
.tech-item .ti-name{color:#c9d1d9;font-size:11px}
.tech-item .ti-desc{color:#6e7681;font-size:9px}
.tech-item .ti-btn{padding:4px 10px;border:1px solid #30363d;border-radius:4px;background:#21262d;color:#F2C14E;font-size:10px;cursor:pointer}
.tech-item .ti-btn:disabled{opacity:0.3;cursor:not-allowed}
.tech-item.maxed{opacity:0.5}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiOverlay">
    <div id="resourceBar">
        <div class="res"><span class="icon">💰</span><span class="val" id="resOre">0</span></div>
        <div class="res"><span class="icon">⚡</span><span class="val pow-ok" id="resPower">0/0</span></div>
        <div class="res"><span class="icon">🔬</span><span class="val" id="resTech">0</span></div>
    </div>
    <div id="techBtn" onclick="toggleTechPanel()">🔬 科技 T1</div>
    <canvas id="miniMap" width="160" height="120"></canvas>
    <div id="alertBar"></div>
    <div id="squadBar"></div>
    <div id="unitInfo">
        <div class="title"><span id="uiTitle">单位</span><span class="count-badge" id="uiCount"></span></div>
        <div class="hp-bar"><div class="hp-fill" id="uiHP" style="width:100%;background:#3FA7D6"></div></div>
        <div class="stat"><span>HP</span><span id="uiHPVal">0/0</span></div>
        <div class="stat"><span>伤害</span><span id="uiDmg">0</span></div>
        <div class="stat"><span>射程</span><span id="uiRange">0</span></div>
        <div class="stat"><span>护甲</span><span id="uiArmor"></span></div>
        <div class="cmd-row">
            <div class="cmd-btn" id="cmdStop">坚守</div>
            <div class="cmd-btn" id="cmdRally">集结</div>
            <div class="cmd-btn" id="cmdDelete">解散</div>
        </div>
    </div>
    <div id="superWeaponBtn" onclick="activateSuperWeapon()">☢ 超武就绪 — 点击目标</div>
    <div id="techPanel">
        <div class="tp-title">🔬 科技升级</div>
        <div id="techItems"></div>
    </div>
    <div id="hint">加载中...</div>
    <div id="toast"></div>
</div>

<div id="buildPanel">
    <div class="build-cat">建造</div>
    <div class="build-btn" data-build="powerplant"><span class="bicon">⚡</span><span class="bname">电厂</span><span class="bcost">300</span></div>
    <div class="build-btn" data-build="refinery"><span class="bicon">⛏</span><span class="bname">矿场</span><span class="bcost">500</span></div>
    <div class="build-btn" data-build="barracks"><span class="bicon">🪖</span><span class="bname">兵营</span><span class="bcost">400</span></div>
    <div class="build-btn" data-build="warfactory"><span class="bicon">🏗</span><span class="bname">车厂</span><span class="bcost">800</span></div>
    <div class="build-btn" data-build="radar"><span class="bicon">📡</span><span class="bname">雷达</span><span class="bcost">600</span></div>
    <div class="build-cat" style="border-right:none;border-left:1px solid #30363d;padding-left:4px">防御</div>
    <div class="build-btn" data-build="mgtower"><span class="bicon">🔫</span><span class="bname">机枪塔</span><span class="bcost">350</span></div>
    <div class="build-btn" data-build="atcannon"><span class="bicon">💥</span><span class="bname">反坦炮</span><span class="bcost">500</span></div>
    <div class="build-cat" style="border-right:none;border-left:1px solid #30363d;padding-left:4px">步兵</div>
    <div class="build-btn" data-produce="rifleman"><span class="bicon">👤</span><span class="bname">步枪兵</span><span class="bcost">150</span></div>
    <div class="build-btn" data-produce="bazooka"><span class="bicon">🎯</span><span class="bname">反坦兵</span><span class="bcost">300</span></div>
    <div class="build-btn" data-produce="sniper"><span class="bicon">🔫</span><span class="bname">狙击手</span><span class="bcost">650</span><span class="lock">🔒T2</span></div>
    <div class="build-cat" style="border-right:none;border-left:1px solid #30363d;padding-left:4px">载具</div>
    <div class="build-btn" data-produce="tank"><span class="bicon">🛡</span><span class="bname">坦克</span><span class="bcost">900</span></div>
    <div class="build-btn" data-produce="heavytank"><span class="bicon">⚙</span><span class="bname">重坦</span><span class="bcost">1300</span><span class="lock">🔒T2</span></div>
    <div class="build-btn" data-produce="artillery"><span class="bicon">🏗</span><span class="bname">火炮</span><span class="bcost">1200</span><span class="lock">🔒T2</span></div>
</div>

<div id="mainMenu">
    <h1>钢铁防线</h1>
    <div class="subtitle">移动端即时战略 · Demo v0.2</div>
    <div class="menu-section">
        <div class="label">选择阵营</div>
        <div class="menu-options" id="factionOpts">
            <div class="menu-opt selected" data-faction="allies">🟦 盟军（精准打击）</div>
            <div class="menu-opt" data-faction="axis">🟥 轴心军（装甲洪流）</div>
        </div>
    </div>
    <div class="menu-section">
        <div class="label">AI 难度</div>
        <div class="menu-options" id="difficultyOpts">
            <div class="menu-opt" data-diff="easy">简单</div>
            <div class="menu-opt selected" data-diff="normal">普通</div>
            <div class="menu-opt" data-diff="hard">困难</div>
        </div>
    </div>
    <div class="menu-section">
        <div class="label">地图</div>
        <div class="menu-options" id="mapOpts">
            <div class="menu-opt selected" data-map="plain">平原遭遇</div>
            <div class="menu-opt" data-map="urban">城市巷战</div>
            <div class="menu-opt" data-map="crossroad">十字路口</div>
        </div>
    </div>
    <button id="startBtn">开始战斗</button>
</div>

<script>
// ================================================================
// 钢铁防线 Demo v0.2 — 全面升级版
// 补齐：编队/科技树/超武/第二阵营差异化/6种单位/3种地图/
//       视觉升级(精细形状+地形纹理+动画+粒子特效)/AI难度
// ================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('miniMap');
const miniCtx = miniCanvas.getContext('2d');

const CONFIG = { WORLD_W: 2000, WORLD_H: 1400, TILE: 24, FPS: 60 };

// === 阵营定义 ===
const FACTIONS = {
    allies: {
        name: '盟军', color: '#3FA7D6', enemyColor: '#E74C3C',
        desc: '精准打击', unitMod: { speedMul: 1.15, costMul: 1.2, rangeMul: 1.1 },
        enemyName: '轴心军',
    },
    axis: {
        name: '轴心军', color: '#E74C3C', enemyColor: '#3FA7D6',
        desc: '装甲洪流', unitMod: { speedMul: 1.0, costMul: 0.85, rangeMul: 1.0, hpMul: 1.2 },
        enemyName: '盟军',
    },
};

// === 单位/建筑定义 ===
const BASE_DEFS = {
    hq:         { name:'指挥中心', hp:2500, w:56, h:56, isBuilding:true, power:0, powerNeed:0, cost:0, sight:200 },
    powerplant: { name:'电厂',     hp:400,  w:40, h:40, isBuilding:true, power:25, powerNeed:0, cost:300, sight:100 },
    refinery:   { name:'矿场',     hp:500,  w:44, h:44, isBuilding:true, power:0, powerNeed:10, cost:500, sight:100 },
    barracks:   { name:'兵营',     hp:600,  w:44, h:44, isBuilding:true, power:0, powerNeed:10, cost:400, sight:100 },
    warfactory: { name:'车厂',     hp:800,  w:52, h:52, isBuilding:true, power:0, powerNeed:20, cost:800, sight:100 },
    radar:      { name:'雷达站',   hp:450,  w:40, h:40, isBuilding:true, power:0, powerNeed:15, cost:600, sight:300, revealsMap:true },
    mgtower:    { name:'机枪塔',   hp:350,  w:32, h:32, isBuilding:true, power:0, powerNeed:5, cost:350, sight:150, dmg:15, range:130, fireRate:0.25, dmgType:'light' },
    atcannon:   { name:'反坦炮',   hp:300,  w:32, h:32, isBuilding:true, power:0, powerNeed:10, cost:500, sight:150, dmg:45, range:140, fireRate:1.2, dmgType:'piercing' },
    // 步兵
    rifleman:   { name:'步枪兵',   hp:100,  r:7,  speed:42, dmg:12, range:75, fireRate:0.5, dmgType:'light', cost:150, isInfantry:true, sight:120 },
    bazooka:    { name:'反坦兵',   hp:90,   r:7,  speed:38, dmg:35, range:80, fireRate:1.5, dmgType:'piercing', cost:300, isInfantry:true, sight:110 },
    sniper:     { name:'狙击手',   hp:80,   r:7,  speed:35, dmg:80, range:120, fireRate:2.5, dmgType:'light', cost:650, isInfantry:true, sight:180, techLevel:2 },
    // 载具
    tank:       { name:'中型坦克', hp:550,  r:14, speed:32, dmg:55, range:100, fireRate:1.0, dmgType:'piercing', cost:900, isVehicle:true, sight:130 },
    heavytank:  { name:'重型坦克', hp:900,  r:17, speed:24, dmg:75, range:105, fireRate:1.2, dmgType:'piercing', cost:1300, isVehicle:true, sight:130, techLevel:2 },
    artillery:  { name:'自行火炮', hp:350,  r:13, speed:26, dmg:90, range:180, fireRate:3.0, dmgType:'explosive', cost:1200, isVehicle:true, sight:150, techLevel:2 },
    // 采矿车
    harvester:  { name:'采矿车',   hp:250,  r:11, speed:36, dmg:0, range:0, fireRate:0, isHarvester:true, sight:80 },
};

// 敌方单位（镜像，颜色不同）
function makeEnemyDefs(factionKey) {
    const enemyFaction = factionKey === 'allies' ? 'axis' : 'allies';
    const defs = {};
    for (const k in BASE_DEFS) {
        defs['enemy_' + k] = { ...BASE_DEFS[k], name: FACTIONS[enemyFaction].name + BASE_DEFS[k].name };
    }
    return defs;
}

// 伤害矩阵
const DMG_MATRIX = {
    light:     { infantry:1.25, vehicle:0.75, heavy:0.4,  building:0.3 },
    piercing:  { infantry:0.6,  vehicle:1.2,  heavy:1.15, building:1.0 },
    explosive: { infantry:1.4,  vehicle:1.0,  heavy:0.7,  building:1.3 },
};

function getArmorType(u) {
    const d = u.def;
    if (d.isBuilding) return 'building';
    if (d.isInfantry) return 'infantry';
    if (d.isVehicle) return d.r > 15 ? 'heavy' : 'vehicle';
    return 'vehicle';
}

// === 地图定义 ===
const MAPS = {
    plain: { name:'平原遭遇', oreNodes:[{x:700,y:700},{x:1000,y:500},{x:400,y:300},{x:1300,y:900}], terrain:'grass', obstacles:[] },
    urban: { name:'城市巷战', oreNodes:[{x:600,y:600},{x:1000,y:700},{x:1400,y:400}], terrain:'urban',
        obstacles:[{x:500,y:400,w:60,h:60},{x:800,y:300,w:80,h:50},{x:1100,y:600,w:60,h:80},{x:600,y:900,w:70,h:60},{x:1300,y:700,w:50,h:70}] },
    crossroad: { name:'十字路口', oreNodes:[{x:1000,y:700},{x:700,y:400},{x:1200,y:1000},{x:400,y:700}],
        terrain:'mixed', obstacles:[{x:1000,y:700,w:40,h:200},{x:700,y:400,w:200,h:40}] },
};

// === 游戏状态 ===
let game = null;
let menuState = { faction:'allies', difficulty:'normal', map:'plain' };

let input = {
    pointers:[], isPanning:false, isBoxSelect:false, boxStart:null, boxEnd:null,
    longPressTimer:null, lastPanPos:null, isSuperWeaponTargeting:false,
};

// === 初始化 ===
function startGame() {
    const faction = FACTIONS[menuState.faction];
    const enemyDefs = makeEnemyDefs(menuState.faction);
    const mapData = MAPS[menuState.map];
    const diffSettings = {
        easy:   { aiInterval:25, aiScale:0.6, aiMaxUnits:8 },
        normal: { aiInterval:18, aiScale:1.0, aiMaxUnits:15 },
        hard:   { aiInterval:12, aiScale:1.4, aiMaxUnits:25 },
    }[menuState.difficulty];

    game = {
        faction: faction,
        enemyFactionKey: menuState.faction === 'allies' ? 'axis' : 'allies',
        enemyDefs: enemyDefs,
        mapData: mapData,
        difficulty: menuState.difficulty,
        diffSettings: diffSettings,
        ore: 1000, powerUsed:0, powerSupply:25, techPoints:0,
        techLevel:1,
        entities:[], bullets:[], effects:[], particles:[],
        selected:[], buildSelection:null,
        squads:[null,null,null,null,null], // 5组编队
        camera:{ x:0, y:0, zoom:1 },
        enemyAI:{ timer:0, phase:0, unitCount:0 },
        superWeapon:{ ready:false, cooldown:0, charge:0, target:null },
        time:0, gameStarted:true, gameOver:false, victory:false,
        exploredTiles: new Set(), // 战争迷雾
    };

    // 玩家基地（左下）
    spawnEntity('hq', 200, 1100, false);
    spawnEntity('harvester', 240, 1100, false);
    spawnEntity('powerplant', 150, 1050, false); // 初始送一个电厂

    // 敌方基地（右上）
    const ex = 1800, ey = 300;
    spawnEntity('enemy_hq', ex, ey, true);
    spawnEntity('enemy_powerplant', ex-60, ey-40, true);
    spawnEntity('enemy_barracks', ex+60, ey-40, true);
    spawnEntity('enemy_mgtower', ex-50, ey+50, true);
    spawnEntity('enemy_mgtower', ex+50, ey+50, true);
    game.entities.filter(e=>e.isEnemy).forEach(e=>{e.buildProgress=1;e.constructing=false});

    // 摄像机初始位置对准玩家基地
    game.camera.x = 100; game.camera.y = 900;
    clampCamera();

    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    setupBuildPanel();
    setupSquadBar();
    setupCommandButtons();
    updateTechPanel();
    requestAnimationFrame(gameLoop);
}

function spawnEntity(typeId, x, y, isEnemy) {
    const def = (isEnemy ? game.enemyDefs : BASE_DEFS)[typeId];
    if (!def) return null;
    // 应用阵营修正
    let finalDef = def;
    if (!isEnemy && game.faction.unitMod) {
        const mod = game.faction.unitMod;
        finalDef = { ...def,
            speed: def.speed ? def.speed * (mod.speedMul||1) : def.speed,
            cost: def.cost ? Math.round(def.cost * (mod.costMul||1)) : def.cost,
            range: def.range ? def.range * (mod.rangeMul||1) : def.range,
            hp: def.hp ? Math.round(def.hp * (mod.hpMul||1)) : def.hp,
        };
    }
    let e = {
        id: Math.random().toString(36).substr(2,9),
        type: typeId, def: finalDef, baseDef: def,
        x, y, hp: finalDef.hp, maxHp: finalDef.hp,
        isEnemy,
        targetX:null, targetY:null, target:null,
        fireTimer:0, holdPosition:false, dead:false,
        buildProgress: finalDef.isBuilding ? 0 : 1,
        constructing: finalDef.isBuilding && !isEnemy,
        rallyX:null, rallyY:null,
        animTime:0, flashTime:0,
        facing:0, // 朝向角度
        // 采矿
        harvestState:'idle', harvestTarget:null, oreCarried:0, harvestTimer:0,
        // 移动平滑
        moveAngle:0,
    };
    game.entities.push(e);
    if (!isEnemy) {
        if (finalDef.power > 0) game.powerSupply += finalDef.power;
        if (finalDef.powerNeed > 0) game.powerUsed += finalDef.powerNeed;
    } else {
        game.enemyAI.unitCount++;
    }
    return e;
}

function removeEntity(e) {
    const idx = game.entities.indexOf(e);
    if (idx >= 0) game.entities.splice(idx, 1);
    if (!e.isEnemy) {
        if (e.def.power > 0) game.powerSupply -= e.def.power;
        if (e.def.powerNeed > 0) game.powerUsed -= e.def.powerNeed;
    } else {
        game.enemyAI.unitCount--;
    }
    // 清理选中与编队
    const sIdx = game.selected.indexOf(e);
    if (sIdx >= 0) game.selected.splice(sIdx, 1);
    game.squads = game.squads.map(s => s ? s.filter(u => u !== e) : null);
    game.entities.forEach(u => { if (u.target === e) u.target = null; });
}

// === 坐标转换 ===
function screenToWorld(sx, sy) {
    return { x: sx / game.camera.zoom + game.camera.x, y: sy / game.camera.zoom + game.camera.y };
}

function clampCamera() {
    const margin = 80;
    game.camera.x = Math.max(-margin, Math.min(CONFIG.WORLD_W - canvas.width / game.camera.zoom + margin, game.camera.x));
    game.camera.y = Math.max(-margin, Math.min(CONFIG.WORLD_H - canvas.height / game.camera.zoom + margin, game.camera.y));
}

// === 输入 ===
function setupInput() {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    let pinchDist = null;
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            pinchDist = null;
            // 双指点击 = 回基地
            if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                if (Math.abs(t1.clientX - t2.clientX) < 80 && Math.abs(t1.clientY - t2.clientY) < 80) {
                    // 够近的双指点击
                }
            }
        }
    }, {passive:false});
    canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if (pinchDist !== null) {
                const ratio = dist / pinchDist;
                game.camera.zoom = Math.max(0.5, Math.min(2.0, game.camera.zoom * ratio));
            }
            pinchDist = dist;
        }
    }, {passive:false});
    canvas.addEventListener('touchend', () => { pinchDist = null; });

    // 小地图点击
    document.getElementById('miniMap').addEventListener('click', (e) => {
        const rect = e.target.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / miniCanvas.width * CONFIG.WORLD_W;
        const my = (e.clientY - rect.top) / miniCanvas.height * CONFIG.WORLD_H;
        game.camera.x = mx - canvas.width / game.camera.zoom / 2;
        game.camera.y = my - canvas.height / game.camera.zoom / 2;
        clampCamera();
    });
}

function onPointerDown(e) {
    e.preventDefault();
    input.pointers.push({id:e.pointerId, x:e.clientX, y:e.clientY});

    if (input.pointers.length === 1) {
        const wp = screenToWorld(e.clientX, e.clientY);

        // 超武瞄准模式
        if (input.isSuperWeaponTargeting) {
            fireSuperWeapon(wp.x, wp.y);
            input.isSuperWeaponTargeting = false;
            document.getElementById('superWeaponBtn').classList.remove('ready');
            document.getElementById('superWeaponBtn').textContent = '☢ 充能中...';
            return;
        }

        // 建造模式
        if (game.buildSelection) {
            tryBuild(game.buildSelection, wp.x, wp.y);
            return;
        }

        const clicked = pickEntity(wp.x, wp.y);
        if (clicked) {
            if (!clicked.isEnemy) {
                if (!e.shiftKey) clearSelection();
                if (!game.selected.includes(clicked)) game.selected.push(clicked);
                showUnitInfo(clicked);
            } else {
                // 攻击命令
                if (game.selected.length > 0) {
                    game.selected.forEach(u => {
                        if (!u.def.isBuilding && !u.def.isHarvester) {
                            u.target = clicked; u.targetX = clicked.x; u.targetY = clicked.y;
                            u.holdPosition = false;
                        }
                    });
                    spawnEffect('attackIndicator', clicked.x, clicked.y);
                }
            }
            return;
        }

        // 点击空地
        if (game.selected.length > 0) {
            const hasMovable = game.selected.some(u => !u.def.isBuilding && !u.def.isHarvester);
            const hasHarvester = game.selected.some(u => u.def.isHarvester);
            if (hasMovable) {
                game.selected.forEach(u => {
                    if (!u.def.isBuilding && !u.def.isHarvester) {
                        u.targetX = wp.x; u.targetY = wp.y; u.target = null; u.holdPosition = false;
                    }
                });
                spawnEffect('moveIndicator', wp.x, wp.y);
            }
            if (hasHarvester) {
                game.selected.filter(u=>u.def.isHarvester).forEach(u => {
                    const node = findNearestOreNode(wp.x, wp.y);
                    if (node) { u.harvestTarget = node; u.harvestState = 'moving'; }
                });
            }
            return;
        }

        // 无选中 → 准备拖动/框选
        input.lastPanPos = {x:e.clientX, y:e.clientY};
        input.boxStart = {x:e.clientX, y:e.clientY};
        input.longPressTimer = setTimeout(() => {
            input.isBoxSelect = true;
        }, 180);
    }
}

function onPointerMove(e) {
    const p = input.pointers.find(p => p.id === e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }

    if (input.pointers.length === 1) {
        const p0 = input.pointers[0];
        if (input.lastPanPos) {
            const dx = p0.x - input.lastPanPos.x;
            const dy = p0.y - input.lastPanPos.y;
            if (input.isBoxSelect) {
                input.boxEnd = {x:p0.x, y:p0.y};
            } else if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                if (input.longPressTimer) { clearTimeout(input.longPressTimer); input.longPressTimer = null; }
                input.isPanning = true;
                game.camera.x -= dx / game.camera.zoom;
                game.camera.y -= dy / game.camera.zoom;
                clampCamera();
                input.lastPanPos = {x:p0.x, y:p0.y};
            }
        }
        // 更新建造预览位置
    }
}

function onPointerUp(e) {
    const idx = input.pointers.findIndex(p => p.id === e.pointerId);
    if (idx >= 0) input.pointers.splice(idx, 1);
    if (input.longPressTimer) { clearTimeout(input.longPressTimer); input.longPressTimer = null; }

    if (input.isBoxSelect && input.boxStart && input.boxEnd) {
        const w1 = screenToWorld(input.boxStart.x, input.boxStart.y);
        const w2 = screenToWorld(input.boxEnd.x, input.boxEnd.y);
        const minX = Math.min(w1.x, w2.x), maxX = Math.max(w1.x, w2.x);
        const minY = Math.min(w1.y, w2.y), maxY = Math.max(w1.y, w2.y);
        clearSelection();
        game.entities.forEach(u => {
            if (!u.isEnemy && !u.def.isBuilding && !u.def.isHarvester && !u.dead &&
                u.x >= minX && u.x <= maxX && u.y >= minY && u.y <= maxY) {
                game.selected.push(u);
            }
        });
        if (game.selected.length > 0) showUnitInfo(game.selected[0]);
        else hideUnitInfo();
    }

    input.isBoxSelect = false; input.isPanning = false;
    input.boxStart = null; input.boxEnd = null; input.lastPanPos = null;
}

function clearSelection() {
    game.selected = [];
    hideUnitInfo();
}

function pickEntity(wx, wy) {
    for (let i = game.entities.length - 1; i >= 0; i--) {
        const e = game.entities[i];
        if (e.dead) continue;
        if (e.def.isBuilding) {
            if (wx >= e.x-e.def.w/2 && wx <= e.x+e.def.w/2 && wy >= e.y-e.def.h/2 && wy <= e.y+e.def.h/2) return e;
        } else {
            const dx = wx-e.x, dy = wy-e.y;
            if (dx*dx+dy*dy <= (e.def.r+8)*(e.def.r+8)) return e;
        }
    }
    return null;
}

function findNearestOreNode(x, y) {
    let nearest = null, minD = Infinity;
    game.mapData.oreNodes.forEach(n => {
        const dx=n.x-x, dy=n.y-y, d=dx*dx+dy*dy;
        if (d < minD) { minD = d; nearest = n; }
    });
    return nearest;
}

// === 建造/生产 ===
function setupBuildPanel() {
    document.querySelectorAll('.build-btn').forEach(btn => {
        btn.onclick = () => {
            if (btn.dataset.build) {
                const def = BASE_DEFS[btn.dataset.build];
                if (game.ore < def.cost) { showToast('矿石不足！'); return; }
                if (game.powerSupply - game.powerUsed < (def.powerNeed||0)) { showToast('电力不足！'); return; }
                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                game.buildSelection = btn.dataset.build;
                showToast('点击地图放置 ' + def.name);
            } else if (btn.dataset.produce) {
                tryProduceUnit(btn.dataset.produce);
            }
        };
    });
}

function tryBuild(typeId, x, y) {
    const def = BASE_DEFS[typeId];
    if (game.ore < def.cost) { showToast('矿石不足！'); return; }
    // 检查重叠
    for (const e of game.entities) {
        if (e.def.isBuilding) {
            const dx=e.x-x, dy=e.y-y;
            if (Math.sqrt(dx*dx+dy*dy) < 36) { showToast('离其他建筑太近！'); return; }
        }
    }
    // 检查地形障碍
    if (game.mapData.obstacles) {
        for (const obs of game.mapData.obstacles) {
            if (x > obs.x-obs.w/2-def.w/2 && x < obs.x+obs.w/2+def.w/2 &&
                y > obs.y-obs.h/2-def.h/2 && y < obs.y+obs.h/2+def.h/2) {
                showToast('地形阻挡！'); return;
            }
        }
    }
    game.ore -= def.cost;
    spawnEntity(typeId, x, y, false);
    game.buildSelection = null;
    document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
}

function tryProduceUnit(typeId) {
    const def = BASE_DEFS[typeId];
    if (def.techLevel && game.techLevel < def.techLevel) { showToast('需要科技 T' + def.techLevel + '！'); return; }
    const cost = game.faction.unitMod ? Math.round(def.cost * (game.faction.unitMod.costMul||1)) : def.cost;
    if (game.ore < cost) { showToast('矿石不足！'); return; }
    const needBuilding = def.isInfantry ? 'barracks' : 'warfactory';
    const producer = game.entities.find(e => e.type === needBuilding && !e.isEnemy && e.buildProgress >= 1 && !e.dead);
    if (!producer) { showToast('需要先建' + (def.isInfantry?'兵营':'车厂') + '！'); return; }
    game.ore -= cost;
    const offX = def.isInfantry ? 28 : 36;
    const unit = spawnEntity(typeId, producer.x+offX, producer.y+producer.def.h/2+12, false);
    if (producer.rallyX !== null) { unit.targetX = producer.rallyX; unit.targetY = producer.rallyY; }
    spawnEffect('spawn', producer.x+offX, producer.y+producer.def.h/2+12);
    showToast(def.name + ' 已生产');
}

function setupCommandButtons() {
    document.getElementById('cmdStop').onclick = () => {
        game.selected.forEach(u => { u.holdPosition = true; u.target = null; u.targetX = u.x; u.targetY = u.y; });
        showToast('坚守位置');
    };
    document.getElementById('cmdRally').onclick = () => {
        // 为生产建筑设置集结点
        const buildings = game.selected.filter(u => u.def.isBuilding && (u.type === 'barracks' || u.type === 'warfactory'));
        if (buildings.length === 0) { showToast('选中兵营或车厂才能设集结点'); return; }
        showToast('点击地面设置集结点');
        // 进入集结点模式
        input.isRallyMode = true;
    };
    document.getElementById('cmdDelete').onclick = () => {
        game.selected.forEach(u => {
            if (u.type !== 'hq') { u.dead = true; spawnEffect('explosion', u.x, u.y); }
        });
        clearSelection();
        showToast('已解散');
    };
}

// === 编队系统 ===
function setupSquadBar() {
    updateSquadBar();
}

function updateSquadBar() {
    const bar = document.getElementById('squadBar');
    bar.innerHTML = '';
    for (let i = 0; i < 5; i++) {
        const btn = document.createElement('div');
        btn.className = 'squad-btn';
        const squad = game.squads[i];
        if (squad && squad.length > 0) {
            btn.classList.add('has-units');
            const count = document.createElement('span');
            count.className = 'count';
            count.textContent = squad.length;
            btn.appendChild(count);
            btn.textContent = (i+1);
            btn.appendChild(count);
        } else {
            btn.classList.add('empty');
            btn.textContent = (i+1);
        }
        btn.onclick = () => {
            if (squad && squad.length > 0) {
                clearSelection();
                game.selected = [...squad.filter(u => !u.dead)];
                if (game.selected.length > 0) {
                    showUnitInfo(game.selected[0]);
                    // 镜头跳到编队
                    const cx = game.selected.reduce((s,u)=>s+u.x,0)/game.selected.length;
                    const cy = game.selected.reduce((s,u)=>s+u.y,0)/game.selected.length;
                    game.camera.x = cx - canvas.width/game.camera.zoom/2;
                    game.camera.y = cy - canvas.height/game.camera.zoom/2;
                    clampCamera();
                }
            }
        };
        bar.appendChild(btn);
    }
}

// 编队操作：选中单位后长按编队按钮 = 编入
// 简化版：通过键盘1-5选中，Shift+1-5编入
// 移动版：点击编队按钮=选中，长按编队按钮=编入当前选中
function assignSquad(slot) {
    if (game.selected.length === 0) { showToast('没有选中单位'); return; }
    const movable = game.selected.filter(u => !u.def.isBuilding && !u.def.isHarvester);
    if (movable.length === 0) { showToast('只能编入战斗单位'); return; }
    game.squads[slot] = [...movable];
    updateSquadBar();
    showToast('编入编队 ' + (slot+1));
}

// 长按编队按钮编入
function setupSquadLongPress() {
    document.addEventListener('DOMContentLoaded', () => {});
}

// === 科技系统 ===
const TECH_UPGRADES = [
    { id:'t2', name:'T2 科技解锁', desc:'解锁狙击手/重坦/火炮', cost:3, techLevel:2, appliesTo:'all' },
    { id:'armor', name:'装甲强化', desc:'全军 HP +15%', cost:5, techLevel:2, effect:{hpMul:1.15} },
    { id:'firepower', name:'火力升级', desc:'全军伤害 +20%', cost:5, techLevel:2, effect:{dmgMul:1.2} },
    { id:'speed', name:'机动强化', desc:'全军速度 +10%', cost:4, techLevel:2, effect:{speedMul:1.1} },
];

let techEffects = { hpMul:1, dmgMul:1, speedMul:1 };

function updateTechPanel() {
    const container = document.getElementById('techItems');
    container.innerHTML = '';
    TECH_UPGRADES.forEach(tech => {
        const item = document.createElement('div');
        item.className = 'tech-item';
        const purchased = isTechPurchased(tech.id);
        const canBuy = !purchased && game.techPoints >= tech.cost && game.techLevel >= (tech.techLevel-1);
        item.innerHTML = `
            <div><div class="ti-name">${tech.name}</div><div class="ti-desc">${tech.desc} · 🔬${tech.cost}</div></div>
            <button class="ti-btn" ${(!canBuy||purchased)?'disabled':''}>${purchased?'✓已升级':'升级'}</button>
        `;
        if (purchased) item.classList.add('maxed');
        item.querySelector('.ti-btn').onclick = () => purchaseTech(tech);
        container.appendChild(item);
    });
}

function isTechPurchased(id) {
    return game.purchasedTechs && game.purchasedTechs.includes(id);
}

function purchaseTech(tech) {
    if (!game.purchasedTechs) game.purchasedTechs = [];
    if (isTechPurchased(tech.id)) return;
    if (game.techPoints < tech.cost) { showToast('科技点不足'); return; }
    game.techPoints -= tech.cost;
    game.purchasedTechs.push(tech.id);
    if (tech.id === 't2') game.techLevel = 2;
    if (tech.effect) {
        if (tech.effect.hpMul) techEffects.hpMul *= tech.effect.hpMul;
        if (tech.effect.dmgMul) techEffects.dmgMul *= tech.effect.dmgMul;
        if (tech.effect.speedMul) techEffects.speedMul *= tech.effect.speedMul;
        // 应用到已有单位
        game.entities.forEach(e => {
            if (!e.isEnemy) {
                if (tech.effect.hpMul) { e.maxHp = Math.round(e.maxHp * tech.effect.hpMul); e.hp = Math.round(e.hp * tech.effect.hpMul); }
                if (tech.effect.dmgMul) e.def = {...e.def, dmg: Math.round((e.def.dmg||0) * tech.effect.dmgMul)};
                if (tech.effect.speedMul) e.def = {...e.def, speed: (e.def.speed||0) * tech.effect.speedMul};
            }
        });
    }
    updateTechPanel();
    showToast(tech.name + ' 已升级！');
}

function toggleTechPanel() {
    const panel = document.getElementById('techPanel');
    if (panel.style.display === 'block') panel.style.display = 'none';
    else { panel.style.display = 'block'; updateTechPanel(); }
}

// === 超武系统 ===
function updateSuperWeapon() {
    if (!game.superWeapon) return;
    const hasRadar = game.entities.some(e => e.type === 'radar' && !e.isEnemy && !e.dead && e.buildProgress >= 1);
    if (!hasRadar) return;
    if (!game.superWeapon.ready) {
        game.superWeapon.charge += 1/60; // 每帧充能
        if (game.superWeapon.charge >= 60) { // 60秒充能
            game.superWeapon.ready = true;
            document.getElementById('superWeaponBtn').classList.add('ready');
            document.getElementById('superWeaponBtn').textContent = '☢ 超武就绪 — 点击目标';
            showAlert('终极武器就绪！');
        }
    }
}

function activateSuperWeapon() {
    if (!game.superWeapon || !game.superWeapon.ready) return;
    input.isSuperWeaponTargeting = true;
    showToast('选择打击目标');
}

function fireSuperWeapon(x, y) {
    game.superWeapon.ready = false;
    game.superWeapon.charge = 0;
    // 核弹效果：大范围高爆伤害
    const radius = 120;
    const damage = 500;
    // 视觉：全屏闪光
    spawnEffect('nukeFlash', x, y);
    spawnEffect('nukeCloud', x, y);
    // 延迟伤害（0.5秒后）
    setTimeout(() => {
        game.entities.forEach(e => {
            if (e.isEnemy && !e.dead) {
                const dx = e.x-x, dy = e.y-y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < radius) {
                    const falloff = 1 - dist/radius;
                    e.hp -= damage * falloff;
                    e.flashTime = 0.3;
                    if (e.hp <= 0) { e.dead = true; spawnEffect('explosion', e.x, e.y); }
                }
            }
        });
        // 持续辐射
        for (let i = 0; i < 20; i++) {
            const a = Math.random()*Math.PI*2;
            const r = Math.random()*radius;
            spawnEffect('radiation', x+Math.cos(a)*r, y+Math.sin(a)*r);
        }
    }, 500);
    showToast('核弹已发射！');
}

// === 单位更新 ===
function updateUnit(e, dt) {
    if (e.dead) return;
    e.animTime += dt;
    if (e.flashTime > 0) e.flashTime -= dt;

    // 建造进度
    if (e.def.isBuilding) {
        if (e.constructing) {
            e.buildProgress += dt / 3;
            if (e.buildProgress >= 1) {
                e.buildProgress = 1; e.constructing = false;
                if (!e.isEnemy) showToast(e.def.name + ' 建造完成');
            }
        }
        // 防御建筑攻击
        if (e.def.dmg && e.buildProgress >= 1) {
            e.fireTimer -= dt;
            if (e.fireTimer <= 0) {
                let target = null, minD = e.def.range * e.def.range;
                game.entities.forEach(u => {
                    if (u.isEnemy === e.isEnemy || u.dead) return;
                    const dx=u.x-e.x, dy=u.y-e.y, d=dx*dx+dy*dy;
                    if (d < minD) { minD = d; target = u; }
                });
                if (target) {
                    e.fireTimer = e.def.fireRate;
                    e.facing = Math.atan2(target.y-e.y, target.x-e.x);
                    dealDamage(e, target);
                    spawnBullet(e.x, e.y, target.x, target.y, e.isEnemy?'#E74C3C':'#F2C14E', e.def.dmgType);
                }
            }
        }
        return;
    }

    // 采矿车
    if (e.def.isHarvester) { updateHarvester(e, dt); return; }

    // 战斗单位
    // 自动寻敌
    if (!e.target && !e.holdPosition && e.targetX === null) {
        let nearest = null, minD = (e.def.range * 1.8) * (e.def.range * 1.8);
        game.entities.forEach(u => {
            if (u.isEnemy === e.isEnemy || u.dead || u.def.isHarvester) return;
            const dx=u.x-e.x, dy=u.y-e.y, d=dx*dx+dy*dy;
            if (d < minD) { minD = d; nearest = u; }
        });
        if (nearest) e.target = nearest;
    }

    if (e.target) {
        if (e.target.dead) { e.target = null; }
        else {
            const dx=e.target.x-e.x, dy=e.target.y-e.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            e.facing = Math.atan2(dy, dx);
            if (dist <= e.def.range) {
                e.fireTimer -= dt;
                if (e.fireTimer <= 0) {
                    e.fireTimer = e.def.fireRate;
                    dealDamage(e, e.target);
                    spawnBullet(e.x, e.y, e.target.x, e.target.y, e.isEnemy?'#E74C3C':'#F2C14E', e.def.dmgType);
                    // 枪口闪光
                    spawnEffect('muzzleFlash', e.x+Math.cos(e.facing)*e.def.r, e.y+Math.sin(e.facing)*e.def.r);
                }
            } else if (!e.holdPosition) {
                moveTowards(e, e.target.x, e.target.y, dt);
            }
        }
    } else if (e.targetX !== null) {
        const dx=e.targetX-e.x, dy=e.targetY-e.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > 3) {
            e.facing = Math.atan2(dy, dx);
            moveTowards(e, e.targetX, e.targetY, dt);
        } else { e.targetX = null; e.targetY = null; }
    }
}

function moveTowards(e, tx, ty, dt) {
    const dx=tx-e.x, dy=ty-e.y, dist=Math.sqrt(dx*dx+dy*dy);
    if (dist > 0.1) {
        const speed = e.def.speed * dt;
        // 单位间避让
        let avoidX = 0, avoidY = 0;
        game.entities.forEach(u => {
            if (u === e || u.dead || u.def.isBuilding) return;
            const ddx = e.x-u.x, ddy = e.y-u.y;
            const dd = ddx*ddx+ddy*ddy;
            const minDist = (e.def.r + u.def.r + 2);
            if (dd < minDist*minDist && dd > 0.01) {
                const d = Math.sqrt(dd);
                const force = (minDist - d) / minDist;
                avoidX += (ddx/d) * force * speed * 0.5;
                avoidY += (ddy/d) * force * speed * 0.5;
            }
        });
        e.x += (dx/dist) * speed + avoidX;
        e.y += (dy/dist) * speed + avoidY;
    }
}

function dealDamage(attacker, target) {
    const armor = getArmorType(target);
    const matrix = DMG_MATRIX[attacker.def.dmgType] || DMG_MATRIX.light;
    const mul = matrix[armor] || 1;
    let dmg = attacker.def.dmg * mul;
    if (!attacker.isEnemy) dmg *= techEffects.dmgMul;
    target.hp -= dmg;
    target.flashTime = 0.08;
    if (target.hp <= 0) {
        target.dead = true;
        spawnEffect('explosion', target.x, target.y);
        spawnParticles(target.x, target.y, target.def.isInfantry ? 6 : 12, target.def.isInfantry ? '#8b949e' : '#555');
    }
}

function updateHarvester(e, dt) {
    if (!e.harvestTarget) {
        const node = findNearestOreNode(e.x, e.y);
        if (node) { e.harvestTarget = node; e.harvestState = 'moving'; }
        return;
    }
    if (e.harvestState === 'moving') {
        const dx=e.harvestTarget.x-e.x, dy=e.harvestTarget.y-e.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < e.harvestTarget.radius || dist < 20) {
            e.harvestState = 'harvesting'; e.harvestTimer = 2;
        } else { e.facing = Math.atan2(dy,dx); moveTowards(e, e.harvestTarget.x, e.harvestTarget.y, dt); }
    } else if (e.harvestState === 'harvesting') {
        e.harvestTimer -= dt;
        if (e.harvestTimer <= 0) { e.oreCarried = 100; e.harvestState = 'returning'; }
    } else if (e.harvestState === 'returning') {
        const refinery = game.entities.find(b => b.type === 'refinery' && !b.isEnemy && !b.dead && b.buildProgress >= 1);
        if (!refinery) return;
        const dx=refinery.x-e.x, dy=refinery.y-e.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 30) {
            game.ore += e.oreCarried;
            game.techPoints += 1; // 采矿也给一点科技点
            e.oreCarried = 0;
            e.harvestState = 'moving';
        } else { e.facing = Math.atan2(dy,dx); moveTowards(e, refinery.x, refinery.y, dt); }
    }
}

// === 敌方 AI ===
function updateEnemyAI(dt) {
    game.enemyAI.timer += dt;
    const ds = game.diffSettings;

    if (game.enemyAI.timer > ds.aiInterval && game.enemyAI.phase === 0) {
        // 第一波：步兵
        const count = Math.round(4 * ds.aiScale);
        for (let i = 0; i < count; i++) {
            const u = spawnEntity('enemy_rifleman', 1780+Math.random()*40, 280+i*25, true);
            u.targetX = 250; u.targetY = 1100;
        }
        game.enemyAI.phase = 1;
        showAlert('敌方步兵来袭！');
    }
    if (game.enemyAI.timer > ds.aiInterval * 2 && game.enemyAI.phase === 1) {
        const count = Math.round(2 * ds.aiScale);
        for (let i = 0; i < count; i++) {
            const u = spawnEntity('enemy_bazooka', 1780+Math.random()*30, 300+i*30, true);
            u.targetX = 250; u.targetY = 1080;
        }
        game.enemyAI.phase = 2;
        showAlert('敌方反装甲部队来袭！');
    }
    if (game.enemyAI.timer > ds.aiInterval * 3 && game.enemyAI.phase === 2) {
        const count = Math.round(2 * ds.aiScale);
        for (let i = 0; i < count; i++) {
            const u = spawnEntity('enemy_tank', 1780+Math.random()*30, 280+i*40, true);
            u.targetX = 250; u.targetY = 1100;
        }
        game.enemyAI.phase = 3;
        showAlert('敌方装甲部队来袭！');
    }
    if (game.enemyAI.phase >= 3 && game.enemyAI.timer > ds.aiInterval * 3 + 10) {
        // 持续出兵
        if (game.enemyAI.unitCount < ds.aiMaxUnits && Math.random() < 0.02) {
            const types = ['enemy_rifleman', 'enemy_rifleman', 'enemy_bazooka', 'enemy_tank', 'enemy_tank'];
            if (game.techLevel >= 2 || game.enemyAI.timer > 90) types.push('enemy_heavytank');
            const type = types[Math.floor(Math.random()*types.length)];
            const u = spawnEntity(type, 1780, 280+Math.random()*60, true);
            u.targetX = 200+Math.random()*150; u.targetY = 1000+Math.random()*120;
        }
        // 困难 AI 偶尔建防御
        if (game.difficulty === 'hard' && Math.random() < 0.005) {
            const existingTowers = game.entities.filter(e => e.type === 'enemy_mgtower' && !e.dead).length;
            if (existingTowers < 6) {
                spawnEntity('enemy_mgtower', 1750+Math.random()*80, 250+Math.random()*80, true).buildProgress = 1;
            }
        }
    }
}

// === 特效 ===
function spawnEffect(type, x, y) {
    game.effects.push({type, x, y, time:0, maxTime: type==='nukeFlash'?0.3 : type==='nukeCloud'?3 : type==='explosion'?0.6 : type==='muzzleFlash'?0.1 : type==='radiation'?2 : 0.4});
}
function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const a = Math.random()*Math.PI*2;
        const s = 30+Math.random()*60;
        game.particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5+Math.random()*0.5, maxLife:1, color, size:2+Math.random()*2});
    }
}
function spawnBullet(fx, fy, tx, ty, color, type) {
    game.bullets.push({x:fx, y:fy, tx, ty, color, type, progress:0, speed: type==='piercing'?800 : 600});
}

// === 游戏循环 ===
let lastTime = 0;
function gameLoop(ts) {
    const dt = Math.min((ts - lastTime)/1000, 0.05);
    lastTime = ts;
    game.time += dt;
    update(dt);
    render();
    updateUI();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    game.entities.forEach(e => updateUnit(e, dt));
    // 清理死亡
    game.entities = game.entities.filter(e => {
        if (e.dead) {
            if (!e.isEnemy) { if (e.def.power>0) game.powerSupply-=e.def.power; if (e.def.powerNeed>0) game.powerUsed-=e.def.powerNeed; }
            else game.enemyAI.unitCount--;
            const sIdx = game.selected.indexOf(e);
            if (sIdx >= 0) game.selected.splice(sIdx, 1);
            return false;
        }
        return true;
    });
    // 子弹
    game.bullets.forEach(b => {
        const dx=b.tx-b.x, dy=b.ty-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy+1);
        b.progress += b.speed * dt / dist;
    });
    game.bullets = game.bullets.filter(b => b.progress < 1);
    // 特效
    game.effects.forEach(e => e.time += dt);
    game.effects = game.effects.filter(e => e.time < e.maxTime);
    // 粒子
    game.particles.forEach(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=100*dt; p.life-=dt; });
    game.particles = game.particles.filter(p => p.life > 0);

    // 敌方 AI
    updateEnemyAI(dt);
    // 超武
    updateSuperWeapon();
    // 编队栏刷新
    if (Math.floor(game.time*2) !== Math.floor((game.time-dt)*2)) updateSquadBar();

    // 胜负
    const pHQ = game.entities.find(e => e.type==='hq' && !e.isEnemy && !e.dead);
    const eHQ = game.entities.find(e => e.type==='enemy_hq' && !e.dead);
    if (!pHQ && !game.gameOver) { game.gameOver = true; showToast('💀 基地被摧毁，游戏结束'); }
    if (!eHQ && !game.gameOver) { game.gameOver = true; game.victory = true; showToast('🏆 胜利！敌方基地已被摧毁！'); }
}

// === 渲染 ===
function render() {
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(game.camera.zoom, game.camera.zoom);
    ctx.translate(-game.camera.x, -game.camera.y);

    drawTerrain();
    drawObstacles();
    game.mapData.oreNodes.forEach(n => drawOreNode(n));
    game.entities.filter(e=>e.def.isBuilding).forEach(e => drawBuilding(e));
    game.entities.filter(e=>!e.def.isBuilding).forEach(e => drawUnit(e));
    game.bullets.forEach(b => drawBullet(b));
    game.effects.forEach(eff => drawEffect(eff));
    game.particles.forEach(p => drawParticle(p));
    game.selected.forEach(e => drawSelectionRing(e));

    if (game.buildSelection && input.pointers.length > 0) {
        const wp = screenToWorld(input.pointers[0].x, input.pointers[0].y);
        drawBuildPreview(game.buildSelection, wp.x, wp.y);
    }
    if (input.isSuperWeaponTargeting && input.pointers.length > 0) {
        const wp = screenToWorld(input.pointers[0].x, input.pointers[0].y);
        ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 2;
        ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.arc(wp.x, wp.y, 120, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(231,76,60,0.1)';
        ctx.beginPath(); ctx.arc(wp.x, wp.y, 120, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();

    // 框选框
    if (input.isBoxSelect && input.boxStart && input.boxEnd) {
        const x=Math.min(input.boxStart.x, input.boxEnd.x), y=Math.min(input.boxStart.y, input.boxEnd.y);
        const w=Math.abs(input.boxEnd.x-input.boxStart.x), h=Math.abs(input.boxEnd.y-input.boxStart.y);
        ctx.strokeStyle = '#3FA7D6'; ctx.fillStyle = 'rgba(63,167,214,0.12)'; ctx.lineWidth = 2;
        ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);
    }

    drawMiniMap();
}

function drawTerrain() {
    const terrain = game.mapData.terrain;
    // 基础底色
    const colors = { grass:'#1a2d1a', urban:'#212028', mixed:'#1e2520' };
    ctx.fillStyle = colors[terrain] || '#1a2d1a';
    ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);

    // 地面纹理（简单图案）
    ctx.strokeStyle = terrain === 'urban' ? 'rgba(60,60,70,0.2)' : 'rgba(40,60,40,0.15)';
    ctx.lineWidth = 1;
    const step = CONFIG.TILE;
    const sx = Math.floor(game.camera.x/step)*step;
    const sy = Math.floor(game.camera.y/step)*step;
    const ex = game.camera.x + canvas.width/game.camera.zoom;
    const ey = game.camera.y + canvas.height/game.camera.zoom;
    for (let x=sx; x<ex; x+=step) { ctx.beginPath(); ctx.moveTo(x,sy); ctx.lineTo(x,ey); ctx.stroke(); }
    for (let y=sy; y<ey; y+=step) { ctx.beginPath(); ctx.moveTo(sx,y); ctx.lineTo(ex,y); ctx.stroke(); }

    // 城市地图：画路面
    if (terrain === 'urban') {
        ctx.fillStyle = 'rgba(50,50,55,0.6)';
        ctx.fillRect(0, 600, CONFIG.WORLD_W, 80);
        ctx.fillRect(900, 0, 80, CONFIG.WORLD_H);
    }
    if (terrain === 'mixed') {
        ctx.fillStyle = 'rgba(50,45,35,0.4)';
        ctx.fillRect(0, 680, CONFIG.WORLD_W, 60);
        ctx.fillRect(960, 0, 60, CONFIG.WORLD_H);
    }

    // 世界边界
    ctx.strokeStyle = 'rgba(80,60,30,0.5)'; ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
}

function drawObstacles() {
    if (!game.mapData.obstacles) return;
    game.mapData.obstacles.forEach(obs => {
        ctx.fillStyle = '#2d2d35';
        ctx.fillRect(obs.x-obs.w/2, obs.y-obs.h/2, obs.w, obs.h);
        ctx.strokeStyle = '#404048'; ctx.lineWidth = 2;
        ctx.strokeRect(obs.x-obs.w/2, obs.y-obs.h/2, obs.w, obs.h);
        // 建筑标识
        ctx.fillStyle = '#404048';
        ctx.fillRect(obs.x-obs.w/2+4, obs.y-obs.h/2+4, obs.w-8, 6);
    });
}

function drawOreNode(n) {
    // 矿点 — 更精细的绘制
    ctx.fillStyle = '#5a4a2a';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius+2, 0, Math.PI*2); ctx.fill();
    // 矿石堆
    ctx.fillStyle = '#C4A96A';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius*0.7, 0, Math.PI*2); ctx.fill();
    // 闪烁光圈
    const pulse = Math.sin(game.time*2)*0.3+0.7;
    ctx.strokeStyle = `rgba(196,169,106,${pulse*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius+5+pulse*3, 0, Math.PI*2); ctx.stroke();
    // 小矿石块
    for (let i = 0; i < 4; i++) {
        const a = i/4*Math.PI*2 + game.time*0.2;
        const r = n.radius * 0.4;
        ctx.fillStyle = '#D4B97A';
        ctx.beginPath(); ctx.arc(n.x+Math.cos(a)*r, n.y+Math.sin(a)*r, 2, 0, Math.PI*2); ctx.fill();
    }
}

function drawBuilding(e) {
    const d = e.def;
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.constructing) {
        const h = d.h * e.buildProgress;
        ctx.fillStyle = d.isEnemy ? 'rgba(231,76,60,0.4)' : 'rgba(63,167,214,0.4)';
        ctx.fillRect(-d.w/2, d.h/2-h, d.w, h);
        ctx.fillStyle = '#F2C14E';
        ctx.fillRect(-d.w/2, -d.h/2-8, d.w*e.buildProgress, 4);
        ctx.restore(); return;
    }

    // 建筑阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-d.w/2+3, -d.h/2+3, d.w, d.h);

    // 建筑本体
    const flash = e.flashTime > 0;
    ctx.fillStyle = flash ? '#fff' : (e.isEnemy ? '#3d2020' : '#1a2a3a');
    ctx.fillRect(-d.w/2, -d.h/2, d.w, d.h);

    // 边框
    ctx.strokeStyle = e.isEnemy ? '#E74C3C' : '#3FA7D6';
    ctx.lineWidth = 2;
    ctx.strokeRect(-d.w/2, -d.h/2, d.w, d.h);

    // 建筑顶部装饰条
    ctx.fillStyle = e.isEnemy ? 'rgba(231,76,60,0.3)' : 'rgba(63,167,214,0.3)';
    ctx.fillRect(-d.w/2, -d.h/2, d.w, 4);

    // 建筑图标
    ctx.font = '18px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const icons = { hq:'🏰', powerplant:'⚡', refinery:'⛏', barracks:'🪖', warfactory:'🏗', radar:'📡', mgtower:'🔫', atcannon:'💥',
        enemy_hq:'🏰', enemy_powerplant:'⚡', enemy_refinery:'⛏', enemy_barracks:'🪖', enemy_warfactory:'🏗', enemy_radar:'📡', enemy_mgtower:'🔫', enemy_atcannon:'💥' };
    ctx.fillText(icons[e.type]||'?', 0, 0);

    // 防御建筑画炮管指向
    if (d.dmg && d.range) {
        ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(e.facing||0)*d.w*0.4, Math.sin(e.facing||0)*d.h*0.4);
        ctx.stroke();
    }

    ctx.restore();

    // HP 条
    if (e.hp < e.maxHp) drawHPBar(e);
}

function drawUnit(e) {
    const d = e.def;
    ctx.save();
    ctx.translate(e.x, e.y);

    // 底座圆环（阵营色 + 等级粗细）
    ctx.strokeStyle = e.isEnemy ? '#E74C3C' : '#3FA7D6';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, d.r+3, 0, Math.PI*2); ctx.stroke();

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(2, 2, d.r, d.r*0.6, 0, 0, Math.PI*2); ctx.fill();

    const flash = e.flashTime > 0;
    const bodyColor = flash ? '#fff' : (e.isEnemy ? '#E74C3C' : '#3FA7D6');

    if (d.isInfantry) {
        // 步兵：头+身+枪
        // 身体
        ctx.fillStyle = flash ? '#fff' : (e.isEnemy ? '#8B1E1E' : '#1F4E8C');
        ctx.beginPath(); ctx.arc(0, 0, d.r, 0, Math.PI*2); ctx.fill();
        // 头部（更小圆）
        ctx.fillStyle = flash ? '#fff' : '#c9d1d9';
        ctx.beginPath(); ctx.arc(0, -d.r*0.3, d.r*0.45, 0, Math.PI*2); ctx.fill();
        // 枪管指向
        const a = e.facing || 0;
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*d.r*0.5, Math.sin(a)*d.r*0.5);
        ctx.lineTo(Math.cos(a)*d.r*1.5, Math.sin(a)*d.r*1.5);
        ctx.stroke();
        // 行走动画（上下浮动）
        if (e.targetX !== null || e.target) {
            const bob = Math.sin(e.animTime*10) * 1.5;
            ctx.translate(0, bob);
        }
    } else if (d.isVehicle) {
        // 载具：车身 + 炮塔 + 履带
        const isHeavy = d.r > 15;
        // 履带
        ctx.fillStyle = '#222';
        ctx.fillRect(-d.r, -d.r*0.8, d.r*2, d.r*0.3);
        ctx.fillRect(-d.r, d.r*0.5, d.r*2, d.r*0.3);
        // 车身
        ctx.fillStyle = flash ? '#fff' : (e.isEnemy ? '#5C2C2C' : '#2C4C7E');
        ctx.fillRect(-d.r*0.9, -d.r*0.5, d.r*1.8, d.r);
        // 车身高光
        ctx.fillStyle = flash ? '#fff' : (e.isEnemy ? '#7C3C3C' : '#4C6C9E');
        ctx.fillRect(-d.r*0.9, -d.r*0.5, d.r*1.8, d.r*0.25);
        // 炮塔
        ctx.fillStyle = flash ? '#fff' : (e.isEnemy ? '#6C2C2C' : '#3C5C8E');
        ctx.beginPath(); ctx.arc(0, 0, d.r*0.45, 0, Math.PI*2); ctx.fill();
        // 炮管
        const a = e.facing || 0;
        ctx.strokeStyle = '#333'; ctx.lineWidth = isHeavy ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a)*d.r*1.6, Math.sin(a)*d.r*1.6);
        ctx.stroke();
        // 炮口
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.arc(Math.cos(a)*d.r*1.6, Math.sin(a)*d.r*1.6, 2, 0, Math.PI*2); ctx.fill();
    } else if (d.isHarvester) {
        // 采矿车：六边形 + 矿仓
        ctx.fillStyle = flash ? '#fff' : '#8B7355';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = i/6*Math.PI*2;
            const px = Math.cos(a)*d.r, py = Math.sin(a)*d.r;
            if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#A0855A'; ctx.lineWidth = 1.5;
        ctx.stroke();
        // 载矿指示
        if (e.oreCarried > 0) {
            ctx.fillStyle = '#C4A96A';
            ctx.beginPath(); ctx.arc(0, 0, d.r*0.45, 0, Math.PI*2); ctx.fill();
        }
        // 旋转动画（采集时）
        if (e.harvestState === 'harvesting') {
            ctx.strokeStyle = '#F2C14E'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, d.r+4, e.animTime*3, e.animTime*3+Math.PI); ctx.stroke();
        }
    }

    ctx.restore();

    if (e.hp < e.maxHp) drawHPBar(e);
}

function drawHPBar(e) {
    const w = e.def.isBuilding ? e.def.w : e.def.r*2.5;
    const x = e.x - w/2;
    const y = e.def.isBuilding ? e.y-e.def.h/2-8 : e.y-e.def.r-8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x-1, y-1, w+2, 6);
    ctx.fillStyle = '#21262d'; ctx.fillRect(x, y, w, 4);
    const ratio = Math.max(0, e.hp/e.maxHp);
    ctx.fillStyle = e.isEnemy ? '#E74C3C' : (ratio > 0.5 ? '#3FA7D6' : ratio > 0.25 ? '#F2C14E' : '#C0392B');
    ctx.fillRect(x, y, w*ratio, 4);
}

function drawSelectionRing(e) {
    const r = e.def.isBuilding ? Math.max(e.def.w, e.def.h)/2+6 : e.def.r+6;
    ctx.strokeStyle = '#F2C14E'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
}

function drawBullet(b) {
    const x = b.x + (b.tx-b.x)*b.progress;
    const y = b.y + (b.ty-b.y)*b.progress;
    // 拖尾
    ctx.strokeStyle = b.color + '60'; ctx.lineWidth = 1;
    ctx.beginPath();
    const trailLen = 8;
    const dx = b.tx-b.x, dy = b.ty-b.y;
    const dist = Math.sqrt(dx*dx+dy*dy+1);
    ctx.moveTo(x, y);
    ctx.lineTo(x - dx/dist*trailLen, y - dy/dist*trailLen);
    ctx.stroke();
    // 弹头
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(x, y, b.type==='piercing' ? 3 : 2, 0, Math.PI*2); ctx.fill();
}

function drawEffect(eff) {
    const t = eff.time / eff.maxTime;
    if (eff.type === 'explosion') {
        const r = 25 * (1-(1-t)**2);
        const a = 1-t;
        ctx.fillStyle = `rgba(255,150,30,${a*0.7})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(255,220,100,${a*0.5})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r*0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${a*0.3})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r*0.2, 0, Math.PI*2); ctx.fill();
    } else if (eff.type === 'muzzleFlash') {
        const a = 1-t;
        ctx.fillStyle = `rgba(255,220,80,${a*0.8})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, 4*(1-t*0.5), 0, Math.PI*2); ctx.fill();
    } else if (eff.type === 'moveIndicator') {
        const r = 12 + t*18;
        const a = (1-t)*0.5;
        ctx.strokeStyle = `rgba(63,167,214,${a})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r, 0, Math.PI*2); ctx.stroke();
        // 箭头
        ctx.fillStyle = `rgba(63,167,214,${a*0.6})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, 3, 0, Math.PI*2); ctx.fill();
    } else if (eff.type === 'attackIndicator') {
        const r = 10 + t*15;
        const a = (1-t)*0.6;
        ctx.strokeStyle = `rgba(231,76,60,${a})`;
        ctx.lineWidth = 2;
        // 十字准星
        ctx.beginPath();
        ctx.moveTo(eff.x-r, eff.y); ctx.lineTo(eff.x+r, eff.y);
        ctx.moveTo(eff.x, eff.y-r); ctx.lineTo(eff.x, eff.y+r);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r*0.6, 0, Math.PI*2); ctx.stroke();
    } else if (eff.type === 'spawn') {
        const r = 20 * t;
        const a = 1-t;
        ctx.strokeStyle = `rgba(63,167,214,${a*0.6})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, r, 0, Math.PI*2); ctx.stroke();
    } else if (eff.type === 'nukeFlash') {
        // 全屏白闪
        const a = (1-t) * 0.8;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(game.camera.x, game.camera.y, canvas.width/game.camera.zoom, canvas.height/game.camera.zoom);
    } else if (eff.type === 'nukeCloud') {
        // 蘑菇云
        const r = 30 + t*80;
        const a = (1-t*0.5) * 0.7;
        // 底部烟柱
        ctx.fillStyle = `rgba(80,60,40,${a*0.5})`;
        ctx.fillRect(eff.x-15, eff.y, 30, 40*(1-t));
        // 蘑菇顶
        ctx.fillStyle = `rgba(255,120,40,${a*0.6})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y-10, r*0.7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(200,100,50,${a*0.7})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y-10, r*0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(100,80,60,${a*0.5})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y-10, r, 0, Math.PI*2); ctx.fill();
    } else if (eff.type === 'radiation') {
        const a = (1-t) * 0.4;
        ctx.fillStyle = `rgba(155,89,182,${a})`;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, 8*(1+t*2), 0, Math.PI*2); ctx.fill();
    }
}

function drawParticle(p) {
    const a = p.life / p.maxLife;
    ctx.fillStyle = p.color.replace(')', `,${a})`).replace('rgb', 'rgba');
    if (!p.color.includes('rgba')) {
        // 简单处理：用 globalAlpha
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
}

function drawBuildPreview(typeId, x, y) {
    const def = BASE_DEFS[typeId];
    if (!def) return;
    let canBuild = game.ore >= def.cost;
    game.entities.forEach(e => {
        if (e.def.isBuilding) {
            const dx=e.x-x, dy=e.y-y;
            if (Math.sqrt(dx*dx+dy*dy) < 36) canBuild = false;
        }
    });
    ctx.strokeStyle = canBuild ? '#3FA7D6' : '#E74C3C';
    ctx.fillStyle = canBuild ? 'rgba(63,167,214,0.15)' : 'rgba(231,76,60,0.15)';
    ctx.lineWidth = 2;
    ctx.fillRect(x-def.w/2, y-def.h/2, def.w, def.h);
    ctx.strokeRect(x-def.w/2, y-def.h/2, def.w, def.h);
    ctx.setLineDash([4,2]);
    ctx.strokeRect(x-def.w/2-4, y-def.h/2-4, def.w+8, def.h+8);
    ctx.setLineDash([]);
}

function drawMiniMap() {
    const mw = miniCanvas.width, mh = miniCanvas.height;
    const sx = mw/CONFIG.WORLD_W, sy = mh/CONFIG.WORLD_H;
    miniCtx.fillStyle = '#0d1117'; miniCtx.fillRect(0, 0, mw, mh);
    // 地形
    miniCtx.fillStyle = game.mapData.terrain === 'urban' ? '#212028' : '#1a2d1a';
    miniCtx.fillRect(0, 0, mw, mh);
    // 障碍
    if (game.mapData.obstacles) {
        miniCtx.fillStyle = '#2d2d35';
        game.mapData.obstacles.forEach(o => miniCtx.fillRect(o.x*sx-o.w*sx/2, o.y*sy-o.h*sy/2, o.w*sx, o.h*sy));
    }
    // 矿点
    miniCtx.fillStyle = '#C4A96A';
    game.mapData.oreNodes.forEach(n => miniCtx.fillRect(n.x*sx-2, n.y*sy-2, 4, 4));
    // 实体
    game.entities.forEach(e => {
        miniCtx.fillStyle = e.isEnemy ? '#E74C3C' : (e.def.isBuilding ? '#555' : '#3FA7D6');
        const s = e.def.isBuilding ? 3 : 2;
        miniCtx.fillRect(e.x*sx-s/2, e.y*sy-s/2, s, s);
    });
    // 摄像机框
    miniCtx.strokeStyle = '#F2C14E'; miniCtx.lineWidth = 1;
    miniCtx.strokeRect(game.camera.x*sx, game.camera.y*sy, (canvas.width/game.camera.zoom)*sx, (canvas.height/game.camera.zoom)*sy);
}

// === UI 更新 ===
function updateUI() {
    const oreEl = document.getElementById('resOre');
    oreEl.textContent = Math.floor(game.ore);
    oreEl.classList.toggle('low', game.ore < 200);

    const powEl = document.getElementById('resPower');
    const powDiff = game.powerSupply - game.powerUsed;
    powEl.textContent = `${game.powerUsed}/${game.powerSupply}`;
    powEl.classList.toggle('pow-ok', powDiff >= 0);
    powEl.classList.toggle('pow-low', powDiff < 0);

    document.getElementById('resTech').textContent = game.techPoints;

    // 科技按钮
    const techBtn = document.getElementById('techBtn');
    techBtn.textContent = `🔬 科技 T${game.techLevel} (${game.techPoints})`;

    // 建造按钮可用性
    document.querySelectorAll('.build-btn').forEach(btn => {
        if (btn.dataset.build) {
            const def = BASE_DEFS[btn.dataset.build];
            btn.classList.toggle('disabled', game.ore < def.cost || game.powerSupply-game.powerUsed < (def.powerNeed||0));
        } else if (btn.dataset.produce) {
            const def = BASE_DEFS[btn.dataset.produce];
            const cost = game.faction.unitMod ? Math.round(def.cost*(game.faction.unitMod.costMul||1)) : def.cost;
            const locked = def.techLevel && game.techLevel < def.techLevel;
            btn.classList.toggle('disabled', game.ore < cost || locked);
        }
    });

    if (game.selected.length > 0) showUnitInfo(game.selected[0]);
}

function showUnitInfo(e) {
    const p = document.getElementById('unitInfo');
    p.style.display = 'block';
    document.getElementById('uiTitle').textContent = e.def.name + (e.isEnemy ? ' (敌)' : '');
    document.getElementById('uiCount').textContent = game.selected.length > 1 ? '×' + game.selected.length : '';
    const hpEl = document.getElementById('uiHP');
    hpEl.style.width = Math.max(0, e.hp/e.maxHp*100) + '%';
    hpEl.style.background = e.isEnemy ? '#E74C3C' : (e.hp/e.maxHp > 0.5 ? '#3FA7D6' : e.hp/e.maxHp > 0.25 ? '#F2C14E' : '#C0392B');
    document.getElementById('uiHPVal').textContent = Math.ceil(Math.max(0,e.hp)) + '/' + e.maxHp;
    document.getElementById('uiDmg').textContent = e.def.dmg || 0;
    document.getElementById('uiRange').textContent = e.def.range || 0;
    const armor = getArmorType(e);
    const armorEl = document.getElementById('uiArmor');
    const armorNames = { infantry:'轻甲', vehicle:'中甲', heavy:'重甲', building:'建筑' };
    armorEl.innerHTML = `<span class="armor-tag armor-${armor}">${armorNames[armor]}</span>`;
}

function hideUnitInfo() { document.getElementById('unitInfo').style.display = 'none'; }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = '0', 2200);
}

function showAlert(msg) {
    const b = document.getElementById('alertBar');
    b.textContent = msg; b.style.display = 'block';
    clearTimeout(b._timer);
    b._timer = setTimeout(() => b.style.display = 'none', 5000);
}

// === 主菜单 ===
function setupMenu() {
    document.querySelectorAll('#factionOpts .menu-opt').forEach(opt => {
        opt.onclick = () => {
            document.querySelectorAll('#factionOpts .menu-opt').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            menuState.faction = opt.dataset.faction;
        };
    });
    document.querySelectorAll('#difficultyOpts .menu-opt').forEach(opt => {
        opt.onclick = () => {
            document.querySelectorAll('#difficultyOpts .menu-opt').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            menuState.difficulty = opt.dataset.diff;
        };
    });
    document.querySelectorAll('#mapOpts .menu-opt').forEach(opt => {
        opt.onclick = () => {
            document.querySelectorAll('#mapOpts .menu-opt').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            menuState.map = opt.dataset.map;
        };
    });
    document.getElementById('startBtn').onclick = startGame;
}

// === 启动 ===
function init() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    setupInput();
    setupMenu();
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

init();
</script>
